[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "los-uav-interception"
version = "0.2.0"
description = "Standalone position and LOS-rate guidance for UAV interception"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy>=1.24",
    "matplotlib>=3.7",
]

[project.scripts]
los-uav = "los_uav_interception.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
